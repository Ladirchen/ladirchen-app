name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion needs full history to compute the version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install vite.plus
        run: |
          curl -fsSL https://vite.plus | bash
          echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"

      - name: Run build-all
        run: bash build.sh -t build-all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webhost-artifacts
          path: |
            .artifacts/WebhostZips/*.zip
            .artifacts/WebhostDockerImages/*.tar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .artifacts/WebhostZips/*.zip
            .artifacts/WebhostDockerImages/*.tar
