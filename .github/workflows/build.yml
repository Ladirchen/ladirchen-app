name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion needs full history to compute the version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install vite.plus
        run: |
          curl -fsSL https://vite.plus | bash
          echo "$HOME/.local/share/vite-plus/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        id: dependencies
        run: vp install

      - name: Run test-all
        id: test-all
        run: bash build.sh -t test-all

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .artifacts/TestResults/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test summary
        if: ${{ !cancelled() && hashFiles('.artifacts/TestResults/**/*.trx', '.artifacts/TestResults/**/*.xml') != '' && steps.test-all.outcome == 'success' }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            .artifacts/TestResults/**/*.trx
            .artifacts/TestResults/**/*.xml
          check_run: false
          comment_mode: off
          job_summary: true

      - name: Run build-all
        run: bash build.sh -t build-all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webhost-artifacts
          path: |
            .artifacts/WebhostZips/*.zip
            .artifacts/WebhostDockerImages/*.tar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .artifacts/WebhostZips/*.zip
            .artifacts/WebhostDockerImages/*.tar
