packages:
  - ./LadirchenApp.Webhost/Apps/ladirchen-app/

allowBuilds:
  "@parcel/watcher": true

catalogs:
  dependencies:
    "@fontsource/roboto": ^5.3.0
    "@vueuse/core": ^15.0.0
    luxon: ^3.7.2
    motion-v: ^2.6.0
    pixi.js: ^8.22.0
    vue: ^3.5.43
    vuetify: ^4.2.4
    pinia: ^4.0.3
    vue-i18n: ^11.4.14
    vue-router: ^5.4.0
  devDependencies:
    "@iconify-json/mdi": ^1.2.3
    "@stylistic/eslint-plugin": ^5.10.0
    "@tsconfig/node22": ^22.0.6
    "@types/luxon": ^3.7.6
    "@types/node": ^24.19.2
    "@unocss/transformer-directives": ^66.10.5
    "@vitejs/plugin-vue": ^6.0.10
    "@vue/tsconfig": ^0.9.1
    sass-embedded: ^1.105.1
    typescript: ~6.0.3
    unocss: ^66.10.5
    unocss-preset-vuetify: ^0.4.0
    vite: npm:@voidzero-dev/vite-plus-core@1.1.0
    vite-plugin-vuetify: ^2.1.3
    vue-tsc: ^3.3.12
    eslint: ^10.12.0
    eslint-config-vuetify: ^4.7.2
    "@vuetify/mcp": ^0.12.1
    vite-plus: 1.1.0
minimumReleaseAgeExclude:
  - "@intlify/core-base@11.4.14"
  - "@intlify/devtools-types@11.4.14"
  - "@intlify/message-compiler@11.4.14"
  - "@intlify/shared@11.4.14"
  - "@types/node@24.19.2"
  - "@vitejs/plugin-vue@6.0.10"
  - vue-i18n@11.4.14
overrides:
  vite@*: catalog:devDependencies
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
