apiVersion: apps/v1
kind: Deployment
metadata:
  name: ladirchen-app-webhost
  labels:
    app: ladirchen-app-webhost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ladirchen-app-webhost
  template:
    metadata:
      labels:
        app: ladirchen-app-webhost
    spec:
      containers:
        - name: webhost
          image: ladirchen-app-webhost
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: http://+:8080
