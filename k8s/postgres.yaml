apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ladirchen-app-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ladirchen-app-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ladirchen-app-postgres
  template:
    metadata:
      labels:
        app: ladirchen-app-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ladirchen
            - name: POSTGRES_USER
              value: ladirchen
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ladirchen-app-postgres
                  key: password
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - "127.0.0.1"
                - -U
                - ladirchen
                - -d
                - ladirchen
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ladirchen-app-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: ladirchen-app-postgres
spec:
  selector:
    app: ladirchen-app-postgres
  ports:
    - port: 5432
      targetPort: 5432
